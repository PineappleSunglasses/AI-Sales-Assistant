[project]
name = "budget-planning-backend"
version = "0.1.0"
description = "FastAPI backend for AI-assisted budget planning validation."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "pypdf>=4.3",
  "python-docx>=1.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
